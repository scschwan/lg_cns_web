spring:
  application:
    name: finance-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # ✅ JSON 파싱 설정 (공통 설정으로 이동)
  jackson:
    mapper:
      accept-case-insensitive-enums: true

  # 기본 데이터 설정 (프로파일 없을 때 fallback)
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/finance}
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

# ✅ JWT 설정
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-please-use-environment-variable}
  access-token-expiration: 3600000      # 1시간
  refresh-token-expiration: 604800000   # 7일

# ✅ AWS 설정
aws:
  region: ap-northeast-2
  s3:
    excel-bucket: finance-excel-uploads
    frontend-bucket: finance-frontend
  sqs:
    excel-queue-url: https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID:123456789012}/finance-excel-processing-queue
    excel-dlq-url: https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID:123456789012}/finance-excel-processing-dlq
    analysis-queue-url: ${ANALYSIS_QUEUE_URL:}

# ✅ 로깅 설정
logging:
  level:
    root: INFO
    com.example.finance: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.data.redis: DEBUG

# ✅ Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mongo:
      enabled: false
    redis:
      enabled: false

---
# ---------------------------------------------------
# 🏠 로컬 개발 프로파일 (local)
# ---------------------------------------------------
spring:
  config:
    activate:
      on-profile: local

  data:
    mongodb:
      uri: mongodb://localhost:27017/finance

    redis:
      host: localhost
      port: 6379
      ssl:
        enabled: false

