// ===========================================================
// Finance Backend - Gradle 빌드 설정
// ===========================================================

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9-SNAPSHOT'   // Spring Boot 플러그인
    id 'io.spring.dependency-management' version '1.1.7'     // 의존성 버전 관리
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'finance-backend'

// Java 21 사용 (Virtual Threads 등 최신 기능 활용)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Lombok 등 컴파일 전용 의존성이 어노테이션 프로세서를 상속하도록 설정
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spring.io/snapshot' }         // Spring Boot 스냅샷 저장소
}

dependencies {
    // ── Spring Boot 핵심 스타터 ──
    implementation 'org.springframework.boot:spring-boot-starter-actuator'     // 모니터링/헬스체크
    implementation 'org.springframework.boot:spring-boot-starter-validation'   // Bean Validation (@Valid)
    implementation 'org.springframework.boot:spring-boot-starter-web'         // REST API (Spring MVC)

    // ── 데이터 저장소 ──
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb' // MongoDB/DocumentDB 연동
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'   // Redis 연동 (캐시, 상태 관리)

    // ── 세션 관리 ──
    implementation 'org.springframework.session:spring-session-data-mongodb'   // MongoDB 기반 세션 저장
    implementation 'org.springframework.session:spring-session-data-redis'     // Redis 기반 세션 저장

    // ── 보안 ──
    implementation 'org.springframework.boot:spring-boot-starter-security'    // Spring Security (인증/인가)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'                         // JWT API
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'                          // JWT 구현체
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'                       // JWT Jackson 직렬화

    // ── API 문서 ──
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0' // Swagger UI (OpenAPI 3.0)

    // ── AWS SDK v2 (BOM 방식) ──
    implementation platform('software.amazon.awssdk:bom:2.28.11')            // AWS SDK 버전 통합 관리
    implementation 'software.amazon.awssdk:s3'                               // S3 파일 업로드/다운로드
    implementation 'software.amazon.awssdk:sqs'                              // SQS 메시지 큐 (Lambda 연동)

    // ── Excel 처리 ──
    implementation 'org.apache.poi:poi:5.2.5'                                // Apache POI (Excel 기본)
    implementation 'org.apache.poi:poi-ooxml:5.2.5'                          // Apache POI (xlsx 형식 지원)

    // ── 자연어 처리 ──
    implementation 'org.openkoreantext:open-korean-text:2.3.1'               // 한국어 형태소 분석 (Okt)

    // ── 개발 도구 ──
    compileOnly 'org.projectlombok:lombok'                                   // Lombok (보일러플레이트 코드 제거)
    annotationProcessor 'org.projectlombok:lombok'                           // Lombok 어노테이션 프로세서

    // ── 테스트 ──
    testImplementation 'org.springframework.boot:spring-boot-starter-test'   // Spring Boot 테스트 지원
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'             // JUnit 5 런처
}

tasks.named('test') {
    useJUnitPlatform()                                // JUnit 5 플랫폼 사용
    jvmArgs("-XX:+EnableDynamicAgentLoading")          // 동적 에이전트 로딩 활성화 (Mockito 등)
    maxHeapSize = '1g'                                // open-korean-text 사전 로딩에 충분한 힙 메모리 할당
}
